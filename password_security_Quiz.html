<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Security Lab</title>
<style>

  /* ============================================================
     PASSWORD SECURITY LAB — AP CYBER / AP CSP ASSESSMENT TOOL
     ------------------------------------------------------------
     HOW TO EDIT THIS FILE (no code editor needed):
     1. Scroll down to the big comment that says "SCENARIO DATA"
        (below, inside the <script> tag).
     2. Each scenario is one block between { and }.
     3. To change the story text, edit the "story" line.
     4. To change the answer, edit "password" — keep it exactly
        matching what a student would type based on the story.
     5. To add/remove a scenario, copy/paste a whole block and
        edit it, or delete one. The tool randomly launches with
        ONE scenario each time the page loads.
     Everything else below is just styling — you shouldn't need
     to touch it.
     ============================================================ */

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eef1f5;
    color: #1c1c1c;
  }

  header {
    background: #0d2f4f;
    padding: 40px 20px 34px;
    text-align: center;
  }

  header h1 {
    margin: 0 0 8px;
    font-size: 2.6em;
    font-weight: 800;
    color: #4aa3e8;
    letter-spacing: 0.5px;
  }

  header p {
    margin: 0;
    color: #dfe8f0;
    font-size: 1.05em;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px 60px;
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 24px;
  }

  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; }
  }

  .card {
    background: #ffffff;
    border-radius: 10px;
    padding: 28px 30px;
    box-shadow: 0 2px 10px rgba(20, 40, 70, 0.08);
  }

  .card h2 {
    margin: 0 0 14px;
    color: #0d3b66;
    font-size: 1.5em;
    font-weight: 800;
  }

  .scenario-badge {
    display: inline-block;
    background: #e8f2fc;
    color: #0d6dbf;
    font-size: 0.72em;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .story-box {
    border: 1px dashed #9cc4e8;
    background: #f4f9fd;
    border-radius: 8px;
    padding: 20px 22px;
    line-height: 1.65;
    font-size: 1.02em;
    white-space: pre-line;
  }

  .instructions {
    margin-top: 18px;
    border-left: 4px solid #0d3b66;
    padding: 12px 18px;
    font-style: italic;
    color: #2c3e50;
    font-size: 0.96em;
    line-height: 1.55;
  }

  label {
    display: block;
    font-weight: 700;
    color: #0d3b66;
    margin: 16px 0 6px;
    font-size: 0.95em;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #c7d2dc;
    border-radius: 7px;
    font-size: 1em;
    background: #fbfcfd;
  }

  input:disabled {
    background: #eef0f2;
    color: #8a9199;
  }

  .attempts-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }

  .attempts-dots {
    display: flex;
    gap: 6px;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #d64545;
  }

  .dot.used {
    background: #dfe4e8;
  }

  button#submitBtn {
    margin-top: 20px;
    width: 100%;
    background: #0d2f4f;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 7px;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
  }

  button#submitBtn:hover:not(:disabled) {
    background: #133e68;
  }

  button#submitBtn:disabled {
    background: #a9b3bc;
    cursor: not-allowed;
  }

  .result-box {
    margin-top: 22px;
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 0.98em;
    min-height: 24px;
    line-height: 1.55;
  }

  .result-box.empty {
    background: #f4f5f6;
    color: #888;
    font-style: italic;
  }

  .result-box.wrong {
    background: #fdecec;
    color: #a12222;
    font-weight: 600;
  }

  .result-box.success {
    background: #e8f7ee;
    color: #1b6b3a;
  }

  .result-box.locked {
    background: #fdecec;
    color: #7a1f1f;
  }

  .success-title, .locked-title {
    display: block;
    font-weight: 800;
    margin-bottom: 6px;
    font-size: 1.05em;
  }

  .reload-note {
    margin-top: 18px;
    font-size: 0.85em;
    color: #7a8592;
    text-align: center;
  }

</style>
</head>
<body>

<header>
  <h1>Password Security Lab</h1>
  <p>Read the scenario carefully. Deduce the password. You have 3 attempts.</p>
</header>

<div class="wrap">

  <!-- LEFT: SCENARIO / CASE FILE -->
  <div class="card">
    <span class="scenario-badge" id="scenarioBadge"></span>
    <h2 id="scenarioTitle"></h2>
    <div class="story-box" id="scenarioStory"></div>
    <div class="instructions">
      Read the case file above carefully. No hints will be given.
    </div>
  </div>

  <!-- RIGHT: LOGIN SIMULATOR -->
  <div class="card">
    <h2>System Login</h2>
    <label for="usernameField">Username</label>
    <input type="text" id="usernameField" disabled>

    <label for="passwordField">Password Attempt</label>
    <input type="text" id="passwordField" placeholder="Enter deduced password" autocomplete="off">

    <div class="attempts-row">
      <div><strong id="attemptsText">3</strong> attempts remaining</div>
      <div class="attempts-dots" id="dots"></div>
    </div>

    <button id="submitBtn">Attempt Login</button>

    <div class="result-box empty" id="resultBox">No attempts made yet.</div>

    <div class="reload-note">Reload the page for a new random scenario.</div>
  </div>

</div>

<script>

/* ============================================================
   SCENARIO DATA — edit scenarios here
   Fields:
     title    -> shown as the case file heading
     badge    -> short uppercase label (context type)
     username -> shown (greyed out) in the login box for flavor
     story    -> the narrative text students must read closely
                 (use \n for line breaks / new paragraphs). Each
                 story is a personal/professional profile containing
                 several real details PLUS a few decoys. There is no
                 stated formula and no worked example anywhere — the
                 password is always [MeaningfulWord][MeaningfulNumber],
                 no spaces, first letter capitalized, and students
                 must figure out which word and number actually matter.
     password -> the exact correct answer (checked case-insensitive,
                 with surrounding spaces ignored)
     explain  -> shown ONLY after a correct guess, explains the
                 derivation for the debrief
   ============================================================ */

  const scenarios = [
    {
      badge: "Corporate Network Breach",
      title: "Case File: Coastal Systems Intrusion",
      username: "d.alvarez_admin",
      story: "INTERNAL IT SECURITY BULLETIN — COASTAL SYSTEMS INC.\n\nAn unusual login attempt was flagged on the admin account belonging to Derek Alvarez, a network administrator who joined the company in 2016. As part of a routine security audit, IT pulled Derek's original employee onboarding survey — an informal internal form new hires fill out for team newsletters and birthday reminders:\n\n\"Hi everyone! I'm Derek, originally from Tulsa, Oklahoma. I went to Oklahoma State before moving out here for this job. Outside of work I'm a huge Thunder fan, and I've got a golden retriever named Rocky who's basically my whole personality at this point. Excited to be part of the network team!\"\n\nSecurity is now attempting to log back into Derek's affected admin account to assess the scope of the breach before resetting credentials.",
      password: "Rocky2016",
      explain: "Derek's dog is named Rocky, and he joined the company in 2016 — giving Rocky2016. His hometown, college, and favorite team were decoys."
    },
    {
      badge: "Social Media Recovery",
      title: "Case File: SecureConnect Account Recovery",
      username: "jordan.reyes",
      story: "SUPPORT TICKET #55291 — SecureConnect Platform\n\nA user named Jordan Reyes has requested emergency access recovery for a locked SecureConnect account after losing access to their linked email. Below is the public bio information from Jordan's profile, submitted as identity verification:\n\n\"Hey everyone! I'm Jordan. I graduated from Lakeside High School back in 2019. Right after graduation, I bought my very first car — a used Honda Civic — with money I'd saved up from a summer job. Still drive that car to this day! Go Lakeside Wolves. I've also got a beagle named Pepper, and I'm a huge Fall Out Boy fan.\"\n\nSecureConnect support is reviewing the account before issuing a manual reset.",
      password: "Civic2019",
      explain: "Jordan's first car was a Civic and their graduation year was 2019 — giving Civic2019. The dog's name and favorite band were decoys."
    },
    {
      badge: "Encrypted File Access",
      title: "Case File: Project Helix Research Archive",
      username: "e.vasquez_lab",
      story: "LAB ARCHIVE ACCESS REQUEST\n\nDr. Elena Vasquez, lead researcher on a classified materials-science project, has left the lab for a sabbatical without documenting her file passwords for her replacement. Her lab notebook was left behind and contains several entries:\n\n\"Jan 5, 2022 — Kicked off the new compound synthesis project today, filed internally under grant #4471.\n\nMarch 2, 2022 — First round of trials failed. Discouraging, but we're not giving up.\n\nJuly 14, 2023 — Breakthrough. After eighteen months of failed trials, we finally synthesized a stable version of the compound. The whole team has taken to calling the project 'Helix' ever since — it stuck long before it became the official codename.\"\n\nIT is attempting to open Dr. Vasquez's encrypted archive to hand it off to her replacement.",
      password: "Helix2023",
      explain: "The project's codename is Helix, and the year of its defining breakthrough was 2023 — giving Helix2023. The grant number and earlier dates were decoys."
    },
    {
      badge: "Banking System Login",
      title: "Case File: First Coastal Bank — Locked Account",
      username: "p.owens",
      story: "CUSTOMER SERVICE CASE NOTES — First Coastal Bank\n\nCustomer Patricia Owens has been locked out of online banking after several failed login attempts and is requesting a temporary reset through phone verification. Her account notes, pulled by the representative, read:\n\n\"Ms. Owens opened her checking account in 2015 at our Doral branch. She grew up in Tampa before moving to South Florida, and she still lists her mother's maiden name, Whitfield, as her security question answer. She's been a loyal customer ever since.\"\n\nThe representative is preparing to reset Patricia's account so she can regain access.",
      password: "Doral2015",
      explain: "Patricia's account was opened at the Doral branch in 2015 — giving Doral2015. Her hometown and mother's maiden name were decoys."
    },
    {
      badge: "Government Database Access",
      title: "Case File: SENTINEL Database Clearance",
      username: "agent_reyes",
      story: "CLASSIFIED — INTERNAL PERSONNEL FILE EXCERPT\n\nAn internal audit is reviewing access logs for the SENTINEL database after a routine clearance review flagged an inactive credential. The personnel file for the assigned field agent reads:\n\n\"Agent Reyes has operated under the field codename 'Nighthawk' since being assigned to the unit in 2019. Following last year's clearance review, Agent Reyes was promoted to Clearance Level 4, granting expanded access to SENTINEL records. Agent Reyes previously served two tours overseas before joining this unit.\"\n\nThe audit team is attempting to log back into the dormant SENTINEL credential to confirm it should be deactivated.",
      password: "Nighthawk4",
      explain: "Agent Reyes' field codename is Nighthawk and their current clearance level is 4 — giving Nighthawk4. The assignment year and prior tours were decoys."
    }
  ];

  // ---- pick one random scenario on load ----
  const scenario = scenarios[Math.floor(Math.random() * scenarios.length)];

  document.getElementById("scenarioBadge").textContent = scenario.badge;
  document.getElementById("scenarioTitle").textContent = scenario.title;
  document.getElementById("scenarioStory").textContent = scenario.story;
  document.getElementById("usernameField").value = scenario.username;

  // ---- attempts state ----
  let attemptsLeft = 3;
  const TOTAL_ATTEMPTS = 3;
  let solved = false;

  const dotsEl = document.getElementById("dots");
  function renderDots() {
    dotsEl.innerHTML = "";
    for (let i = 0; i < TOTAL_ATTEMPTS; i++) {
      const d = document.createElement("div");
      d.className = "dot" + (i < attemptsLeft ? "" : " used");
      dotsEl.appendChild(d);
    }
  }
  renderDots();

  const passwordField = document.getElementById("passwordField");
  const submitBtn = document.getElementById("submitBtn");
  const resultBox = document.getElementById("resultBox");
  const attemptsText = document.getElementById("attemptsText");

  function normalize(s) {
    return s.trim().toLowerCase();
  }

  function endGame(disable) {
    passwordField.disabled = true;
    submitBtn.disabled = true;
  }

  submitBtn.addEventListener("click", attemptLogin);
  passwordField.addEventListener("keydown", function(e) {
    if (e.key === "Enter") attemptLogin();
  });

  function attemptLogin() {
    if (solved || attemptsLeft <= 0) return;

    const guess = passwordField.value;
    if (guess.trim() === "") return;

    if (normalize(guess) === normalize(scenario.password)) {
      solved = true;
      resultBox.className = "result-box success";
      resultBox.innerHTML =
        '<span class="success-title">✔ Access Granted</span>' +
        "Correct password: <strong>" + scenario.password + "</strong><br><br>" +
        scenario.explain;
      endGame();
      return;
    }

    attemptsLeft--;
    attemptsText.textContent = attemptsLeft;
    renderDots();
    passwordField.value = "";

    if (attemptsLeft <= 0) {
      resultBox.className = "result-box locked";
      resultBox.innerHTML =
        '<span class="locked-title">✖ Account Locked</span>' +
        "Incorrect password. Attempts remaining: 0<br><br>" +
        "The correct password was <strong>" + scenario.password + "</strong>. " +
        scenario.explain;
      endGame();
    } else {
      resultBox.className = "result-box wrong";
      resultBox.textContent = "Incorrect password. Attempts remaining: " + attemptsLeft;
    }
  }

</script>

</body>
</html>
