    { bi: 5, d: 3, q: "Public-key (asymmetric) encryption works because:", choices: ["The public key can decrypt anything", "Data encrypted with a public key can only be decrypted with the matching private key", "Both keys are kept secret", "It uses no math"], answer: 1, exp: "Public keys encrypt; only the matching private key decrypts. This is how HTTPS and digital signatures work." },

  const BI_NAMES = {1: "Creative Development", 2: "Data", 3: "Algorithms & Programming", 4: "Computer Systems & Networks", 5: "Impact of Computing"};
  const BI_COLORS = {
    1: { bg: "#EEEDFE", fg: "#3C3489" },
    2: { bg: "#E1F5EE", fg: "#085041" },
    3: { bg: "#E6F1FB", fg: "#0C447C" },

  // Slime block colors per tier — kept distinct so students see the difficulty
  const TIER_COLORS = {
    1: { body: "#5DCAA5", dark: "#0F6E56", light: "#9FE1CB", core: "#0A4A3A", name: "Green slime block" },
    2: { body: "#378ADD", dark: "#185FA5", light: "#85B7EB", core: "#0F3D6E", name: "Blue slime block" },

  };

  const TIER_LABELS = {1: "Easy", 2: "Medium", 3: "Hard", 4: "Boss"};

  const COLS = 15;
  const ROWS = 11;
  const CELL = 44;

  function generateMaze() {
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(1));
    function carve(x, y) {
      grid[y][x] = 0;
      const dirs = [[0,-2],[2,0],[0,2],[-2,0]];
      for (let i = dirs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
      }
      for (const [dx, dy] of dirs) {
        const nx = x + dx;
        const ny = y + dy;
        if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && grid[ny][nx] === 1) {
          grid[y + dy/2][x + dx/2] = 0;
          carve(nx, ny);
        }
      }
    }
    carve(1, 1);
    for (let y = 1; y < ROWS - 1; y++) {
      for (let x = 1; x < COLS - 1; x++) {
        if (grid[y][x] === 1 && Math.random() < 0.06) {
          const horizontalOpen = grid[y][x-1] === 0 && grid[y][x+1] === 0;
          const verticalOpen = grid[y-1] && grid[y+1] && grid[y-1][x] === 0 && grid[y+1][x] === 0;
          if (horizontalOpen || verticalOpen) grid[y][x] = 0;
        }
      }
    }
    // Find a portal location that's GUARANTEED to be reachable from (1,1).
    // Strategy: scan from bottom-right inward looking for an open cell, then
    // turn it into a portal. The recursive backtracker guarantees all carved
    // cells are reachable from the start.
    let portalX = -1, portalY = -1;
    outer: for (let y = ROWS - 2; y >= 1; y--) {
      for (let x = COLS - 2; x >= 1; x--) {
        if (grid[y][x] === 0) {
          portalX = x;
          portalY = y;
          break outer;
        }
      }
    }
    // Fallback (should never happen with a properly carved maze)
    if (portalX === -1) { portalX = 1; portalY = 1; }
    grid[portalY][portalX] = 2;
    return { grid, portalX, portalY };
  }

  // BFS: returns true if (tx,ty) is reachable from (sx,sy) treating walls as blocking
  function isReachable(grid, sx, sy, tx, ty) {
    if (sx === tx && sy === ty) return true;
    const visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    const queue = [[sx, sy]];
    visited[sy][sx] = true;
    while (queue.length) {
      const [x, y] = queue.shift();
      for (const [dx, dy] of [[0,-1],[1,0],[0,1],[-1,0]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        if (visited[ny][nx]) continue;
        if (grid[ny][nx] === 1) continue;
        if (nx === tx && ny === ty) return true;
        visited[ny][nx] = true;
        queue.push([nx, ny]);
      }
    }
    return false;
  }

  let state = {
    mode: "menu",
    gameMode: "adventure",
    practiceTier: 1,
    maze: null,
    portal: { x: 13, y: 9 },
    player: { x: 1, y: 1, facing: 1 },
    monsters: [],
    boss: null,
    questionQueue1: [],
    questionQueue2: [],
    questionQueue3: [],
    bossQueue: [],
    currentQuestion: null,
    currentMonster: null,
    selectedChoice: null,
    showFeedback: false,
    lives: 3,
    questionsAnswered: 0,
    correctAnswers: 0,
    monstersDefeated: 0,
    streak: 0,
    bestStreak: 0,
    difficultyTier: 1,
    startTime: null,
    elapsedTime: 0,
    timerInterval: null,
    monsterMoveInterval: null,
    animInterval: null,
    tick: 0
  };

  const root = document.getElementById("screen");

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function openCells(grid) {
    const cells = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (grid[y][x] === 0) cells.push({x, y});
    }
    return cells;
  }

  function canMove(x, y) {
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return false;
    return state.maze[y][x] !== 1;
  }

  function initMonsters() {
    const open = openCells(state.maze).filter(c => state.maze[c.y][c.x] === 0);
    const validSpots = open.filter(c => {
      const dist = Math.abs(c.x - 1) + Math.abs(c.y - 1);
      return dist > 4 && !(c.x === state.portal.x && c.y === state.portal.y);
    });
    const count = state.gameMode === "practice" ? 8 : 6;
    const spots = shuffle(validSpots).slice(0, count);
    return spots.map((s, i) => ({
      x: s.x, y: s.y, id: i,
      dir: Math.floor(Math.random() * 4),
      bouncePhase: Math.random() * Math.PI * 2,
      isBoss: false
    }));
  }

  function initBoss() {
    const px = state.portal.x;
    const py = state.portal.y;
    // Try each tile adjacent to the portal first
    const candidates = [[px-1, py], [px, py-1], [px+1, py], [px, py+1]];
    for (const [bx, by] of candidates) {
      if (bx >= 0 && bx < COLS && by >= 0 && by < ROWS
          && state.maze[by][bx] === 0
          && isReachable(state.maze, 1, 1, bx, by)) {
        return { x: bx, y: by, id: 999, dir: 0, bouncePhase: 0, isBoss: true, stationary: true };
      }
    }
    // Widen search outward until we find a reachable open tile near the portal
    for (let r = 1; r < Math.max(COLS, ROWS); r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue; // ring only
          const bx = px + dx, by = py + dy;
          if (bx >= 0 && bx < COLS && by >= 0 && by < ROWS
              && state.maze[by][bx] === 0
              && !(bx === 1 && by === 1)
              && isReachable(state.maze, 1, 1, bx, by)) {
            return { x: bx, y: by, id: 999, dir: 0, bouncePhase: 0, isBoss: true, stationary: true };
          }
        }
      }
    }
    return null;
  }

  function startGame(mode, practiceTier) {
    state.gameMode = mode || "adventure";
    state.practiceTier = practiceTier || 1;

    // Generate a maze that satisfies all requirements:
    // - portal is reachable from (1,1)
    // - in adventure mode, a valid boss spawn exists adjacent to the portal AND is reachable
    let grid, portalX, portalY, bossCandidate;
    let attempts = 0;
    do {
      const m = generateMaze();
      grid = m.grid; portalX = m.portalX; portalY = m.portalY;
      // Temporarily set state.maze so initBoss can use it
      state.maze = grid;
      state.portal = { x: portalX, y: portalY };
      const portalReachable = isReachable(grid, 1, 1, portalX, portalY);
      if (!portalReachable) { attempts++; continue; }
      if (state.gameMode === "adventure") {
        bossCandidate = initBoss();
        if (!bossCandidate) { attempts++; continue; }
      }
      break;
    } while (attempts < 50);

    state.maze = grid;
    state.portal = { x: portalX, y: portalY };
    state.player = { x: 1, y: 1, facing: 1 };
    state.monsters = initMonsters();
    state.boss = null;
    if (state.gameMode === "adventure") {
      state.boss = bossCandidate || initBoss();
      if (state.boss) state.monsters.push(state.boss);
    }
    state.questionQueue1 = shuffle(QUESTIONS.filter(q => q.d === 1));
    state.questionQueue2 = shuffle(QUESTIONS.filter(q => q.d === 2));
    state.questionQueue3 = shuffle(QUESTIONS.filter(q => q.d === 3));
    state.bossQueue = shuffle(QUESTIONS.filter(q => q.d === 4));
    state.lives = state.gameMode === "practice" ? Infinity : 3;
    state.questionsAnswered = 0;
    state.correctAnswers = 0;
    state.monstersDefeated = 0;
    state.bossSkipped = false;
    state.streak = 0;
    state.bestStreak = 0;
    state.difficultyTier = state.gameMode === "practice" ? state.practiceTier : 1;
    state.startTime = Date.now();
    state.elapsedTime = 0;
    state.tick = 0;
    state.mode = "playing";
    if (state.timerInterval) clearInterval(state.timerInterval);
    if (state.monsterMoveInterval) clearInterval(state.monsterMoveInterval);
    if (state.animInterval) clearInterval(state.animInterval);
    state.timerInterval = setInterval(() => {
      state.elapsedTime = Math.floor((Date.now() - state.startTime) / 1000);
      updateHUD();
    }, 500);
    state.monsterMoveInterval = setInterval(moveMonsters, 650);
    state.animInterval = setInterval(() => {
      state.tick++;
      if (state.mode === "playing") drawMaze();
    }, 80);
    render();
  }

  function respawnSlimesIfNeeded() {
    if (state.gameMode === "practice" && state.monsters.length === 0) {
      state.monsters = initMonsters();
    }
  }

  function getSlimeColor(monster) {
    if (monster.isBoss) return TIER_COLORS[4];
    return TIER_COLORS[state.difficultyTier];
  }

  function movePlayer(dx, dy) {
    if (state.mode !== "playing") return;
    if (dx < 0) state.player.facing = -1;
    if (dx > 0) state.player.facing = 1;
    const nx = state.player.x + dx;
    const ny = state.player.y + dy;
    if (!canMove(nx, ny)) return;

    // Show portal-choice dialog while boss is alive (adventure mode only)
    if (state.gameMode === "adventure" && state.boss && state.maze[ny] && state.maze[ny][nx] === 2) {
      showPortalChoice();
      return;
    }

    state.player.x = nx;
    state.player.y = ny;
    drawMaze();
    checkCollisions();
    if (state.maze[ny] && state.maze[ny][nx] === 2 && state.mode === "playing") {
      if (state.gameMode === "practice") regenerateMazeForPractice();
      else victory();
    }
  }

  function showPortalChoice() {
    state.mode = "portal_choice";
    if (state.monsterMoveInterval) clearInterval(state.monsterMoveInterval);
    render();
  }

  function chooseFightBoss() {
    state.mode = "playing";
    state.monsterMoveInterval = setInterval(moveMonsters, 650);
    render();
  }

  function chooseSkipBoss() {
    // Pay 1 life to bypass the boss
    state.lives -= 1;
    if (state.lives <= 0) { defeat(); return; }
    // Remove the boss from the maze
    state.monsters = state.monsters.filter(m => !m.isBoss);
    state.boss = null;
    // Trigger victory with a flag so the result screen reflects the skip
    state.bossSkipped = true;
    victory();
  }

  function regenerateMazeForPractice() {
    let grid, portalX, portalY;
    let attempts = 0;
    do {
      const m = generateMaze();
      grid = m.grid; portalX = m.portalX; portalY = m.portalY;
      if (isReachable(grid, 1, 1, portalX, portalY)) break;
      attempts++;
    } while (attempts < 50);
    state.maze = grid;
    state.portal = { x: portalX, y: portalY };
    state.player = { x: 1, y: 1, facing: 1 };
    state.monsters = initMonsters();
    drawMaze();
  }

  function moveMonsters() {
    if (state.mode !== "playing") return;
    const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
    state.monsters.forEach(m => {
      if (m.stationary) return;
      if (Math.random() < 0.3) m.dir = Math.floor(Math.random() * 4);
      const [dx, dy] = dirs[m.dir];
      const nx = m.x + dx;
      const ny = m.y + dy;
      if (canMove(nx, ny)) { m.x = nx; m.y = ny; }
      else m.dir = Math.floor(Math.random() * 4);
    });
    drawMaze();
    checkCollisions();
  }

  function checkCollisions() {
    if (state.mode !== "playing") return;
    const hit = state.monsters.find(m => m.x === state.player.x && m.y === state.player.y);
    if (hit) startCombat(hit);
  }

  function pickQuestion(isBoss) {
    if (isBoss || (state.gameMode === "practice" && state.practiceTier === 4)) {
      if (!state.bossQueue.length) state.bossQueue = shuffle(QUESTIONS.filter(q => q.d === 4));
      return state.bossQueue.shift();
    }
    let pool;
    if (state.difficultyTier === 1) pool = "questionQueue1";
    else if (state.difficultyTier === 2) pool = "questionQueue2";
    else pool = "questionQueue3";
    if (!state[pool].length) {
      const d = state.difficultyTier;
      state[pool] = shuffle(QUESTIONS.filter(q => q.d === d));
    }
    return state[pool].shift();
  }

  function shuffleQuestionChoices(q) {
    // Pair each choice with its original index, shuffle, then rebuild
    const paired = q.choices.map((c, i) => ({ choice: c, wasCorrect: i === q.answer }));
    const shuffled = shuffle(paired);
    return {
      bi: q.bi,
      d: q.d,
      q: q.q,
      choices: shuffled.map(p => p.choice),
      answer: shuffled.findIndex(p => p.wasCorrect),
      exp: q.exp
    };
  }

  function startCombat(monster) {
    state.mode = "combat";
    state.currentMonster = monster;
    state.currentQuestion = shuffleQuestionChoices(pickQuestion(monster.isBoss));
    state.selectedChoice = null;
    state.showFeedback = false;
    if (state.monsterMoveInterval) clearInterval(state.monsterMoveInterval);
    render();
  }

  function submitAnswer(idx) {
    if (state.showFeedback) return;
    state.selectedChoice = idx;
    state.showFeedback = true;
    state.questionsAnswered++;
    const correct = idx === state.currentQuestion.answer;
    const isBoss = state.currentMonster.isBoss;
    if (correct) {
      state.correctAnswers++;
      state.monstersDefeated++;
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      if (state.gameMode === "adventure") {
        if (state.streak >= 5) state.difficultyTier = 3;
        else if (state.streak >= 2) state.difficultyTier = 2;
      }
    } else {
      if (state.gameMode === "adventure") {
        state.lives -= isBoss ? 2 : 1;
        if (state.difficultyTier > 1) state.difficultyTier = Math.max(1, state.difficultyTier - 1);
      }
      state.streak = 0;
    }
    renderCombat();
  }

  function resumeGame() {
    if (state.gameMode === "adventure" && state.lives <= 0) { defeat(); return; }
    const correct = state.selectedChoice === state.currentQuestion.answer;
    if (correct) {
      state.monsters = state.monsters.filter(m => m.id !== state.currentMonster.id);
      if (state.currentMonster.isBoss) state.boss = null;
      respawnSlimesIfNeeded();
    } else {
      const dirs = [[0,-1],[1,0],[0,1],[-1,0]];
      for (const [dx, dy] of shuffle(dirs)) {
        const nx = state.player.x + dx;
        const ny = state.player.y + dy;
        if (canMove(nx, ny) && !state.monsters.find(m => m.x === nx && m.y === ny)) {
          state.player.x = nx;
          state.player.y = ny;
          break;
        }
      }
    }
    state.mode = "playing";
    state.currentQuestion = null;
    state.currentMonster = null;
    state.monsterMoveInterval = setInterval(moveMonsters, 650);
    render();
  }

  function exitPractice() {
    state.mode = "practice_summary";
    if (state.timerInterval) clearInterval(state.timerInterval);
    if (state.monsterMoveInterval) clearInterval(state.monsterMoveInterval);
    if (state.animInterval) clearInterval(state.animInterval);
    render();
  }

  function victory() {
    state.mode = "victory";
    if (state.timerInterval) clearInterval(state.timerInterval);
    if (state.monsterMoveInterval) clearInterval(state.monsterMoveInterval);
    if (state.animInterval) clearInterval(state.animInterval);
    render();
  }
  function defeat() {
    state.mode = "defeat";
    if (state.timerInterval) clearInterval(state.timerInterval);
    if (state.monsterMoveInterval) clearInterval(state.monsterMoveInterval);
    if (state.animInterval) clearInterval(state.animInterval);
    render();
  }

  function updateHUD() {
    const hud = document.getElementById("hud");
    if (!hud) return;
    const mins = Math.floor(state.elapsedTime / 60);
    const secs = state.elapsedTime % 60;
    const timeStr = mins + ":" + (secs < 10 ? "0" : "") + secs;
    const tierColors = {1: "#5DCAA5", 2: "#85B7EB", 3: "#F0997B", 4: "#E24B4A"};
    const isPractice = state.gameMode === "practice";

    if (isPractice) {
      const acc = state.questionsAnswered > 0 ? Math.round((state.correctAnswers / state.questionsAnswered) * 100) : 0;
      hud.innerHTML = `
        <div class="hud-pill" style="background: #5E4E1E; color: #FFE082;"><strong>Practice mode</strong></div>
        <div class="hud-pill"><span style="opacity:0.7;">Tier</span> <strong style="color:${tierColors[state.difficultyTier]};">${TIER_LABELS[state.difficultyTier]}</strong></div>
        <div class="hud-pill"><span style="opacity:0.7;">Correct</span> <strong>${state.correctAnswers}/${state.questionsAnswered}${state.questionsAnswered ? ' (' + acc + '%)' : ''}</strong></div>
        <div class="hud-pill"><span style="opacity:0.7;">Streak</span> <strong>${state.streak > 0 ? '🔥' : ''}${state.streak}</strong></div>
        <div class="hud-pill"><span style="opacity:0.7;">Time</span> <strong>${timeStr}</strong></div>
        <button id="exit-practice" style="padding: 6px 14px; font-size: 13px;">End session</button>
      `;
      const ep = document.getElementById("exit-practice");
      if (ep) ep.addEventListener("click", exitPractice);
    } else {
      const slimesLeft = state.monsters.filter(m => !m.isBoss).length;
      hud.innerHTML = `
        <div class="hud-pill"><span style="opacity:0.7;">Lives</span> <strong>${"❤️".repeat(state.lives)}${"🖤".repeat(Math.max(0, 3 - state.lives))}</strong></div>
        <div class="hud-pill"><span style="opacity:0.7;">Slimes</span> <strong>${slimesLeft}${state.boss ? ' +👑' : ''}</strong></div>
        <div class="hud-pill"><span style="opacity:0.7;">Difficulty</span> <strong style="color:${tierColors[state.difficultyTier]};">${TIER_LABELS[state.difficultyTier]}</strong></div>
        <div class="hud-pill"><span style="opacity:0.7;">Streak</span> <strong>${state.streak > 0 ? '🔥' : ''}${state.streak}</strong></div>
        <div class="hud-pill"><span style="opacity:0.7;">Time</span> <strong>${timeStr}</strong></div>
      `;
    }
  }

  // ===== MINECRAFT-THEMED SPRITES =====

  // Cobblestone floor — mimics Minecraft cobblestone block top-down view
  function drawFloor(ctx, px, py) {
    // Base gray
    ctx.fillStyle = "#7c7c7c";
    ctx.fillRect(px, py, CELL, CELL);
    // Darker patches (cobblestone has irregular dark spots)
    const seed = ((px * 31) ^ (py * 17)) & 0xff;
    ctx.fillStyle = "#5e5e5e";
    ctx.fillRect(px + (seed % 12) + 2, py + ((seed * 3) % 12) + 2, 8, 6);
    ctx.fillRect(px + 22 + (seed % 10), py + 24 + ((seed * 5) % 10), 8, 7);
    ctx.fillStyle = "#6a6a6a";
    ctx.fillRect(px + 4, py + 24, 6, 8);
    ctx.fillRect(px + 24, py + 6, 10, 6);
    // Light specks
    ctx.fillStyle = "#909090";
    ctx.fillRect(px + 14 + (seed % 6), py + 12, 4, 3);
    ctx.fillRect(px + 6, py + 38, 4, 3);
    // Pixel border (subtle dark)
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(px, py, CELL, 2);
    ctx.fillRect(px, py, 2, CELL);
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.fillRect(px, py + CELL - 1, CELL, 1);
    ctx.fillRect(px + CELL - 1, py, 1, CELL);
  }

  // Stone brick wall — Minecraft's stone bricks pattern
  function drawWall(ctx, px, py) {
    // Base stone color
    ctx.fillStyle = "#6e6e6e";
    ctx.fillRect(px, py, CELL, CELL);

    // Brick pattern — top row of bricks
    const brickH = CELL / 2;
    // Top half: two bricks
    ctx.fillStyle = "#5a5a5a";
    ctx.fillRect(px + 2, py + 2, CELL - 4, brickH - 4);
    ctx.fillStyle = "#7a7a7a";
    ctx.fillRect(px + 2, py + 2, CELL - 4, 2); // top highlight
    // Vertical groove in middle
    ctx.fillStyle = "#3a3a3a";
    ctx.fillRect(px + CELL/2 - 1, py + 2, 2, brickH - 4);

    // Bottom half: offset brick
    ctx.fillStyle = "#5a5a5a";
    ctx.fillRect(px + 2, py + brickH + 2, CELL - 4, brickH - 4);
    ctx.fillStyle = "#7a7a7a";
    ctx.fillRect(px + 2, py + brickH + 2, CELL - 4, 2);

    // Horizontal groove
    ctx.fillStyle = "#3a3a3a";
    ctx.fillRect(px + 2, py + brickH - 1, CELL - 4, 2);

    // Texture pixels
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(px + 10, py + 8, 3, 2);
    ctx.fillRect(px + 28, py + 12, 2, 2);
    ctx.fillRect(px + 8, py + 30, 2, 3);
    ctx.fillRect(px + 30, py + 32, 3, 2);

    ctx.fillStyle = "rgba(255,255,255,0.1)";
    ctx.fillRect(px + 14, py + 6, 2, 2);
    ctx.fillRect(px + 24, py + 28, 2, 2);
  }

  // End portal — black with stars and purple particles, like Minecraft's end portal
  function drawPortal(ctx, px, py, tick) {
    // Floor underneath
    drawFloor(ctx, px, py);
    // Black portal base
    ctx.fillStyle = "#0a0118";
    ctx.fillRect(px + 4, py + 4, CELL - 8, CELL - 8);
    // Frame (gold-ish end portal frame)
    ctx.fillStyle = "#7a6b3a";
    ctx.fillRect(px + 2, py + 2, CELL - 4, 3);
    ctx.fillRect(px + 2, py + CELL - 5, CELL - 4, 3);
    ctx.fillRect(px + 2, py + 2, 3, CELL - 4);
    ctx.fillRect(px + CELL - 5, py + 2, 3, CELL - 4);
    // Eyes of ender on the frame
    ctx.fillStyle = "#a09040";
    ctx.fillRect(px + CELL/2 - 2, py + 2, 4, 3);
    ctx.fillRect(px + CELL/2 - 2, py + CELL - 5, 4, 3);
    ctx.fillRect(px + 2, py + CELL/2 - 2, 3, 4);
    ctx.fillRect(px + CELL - 5, py + CELL/2 - 2, 3, 4);

    // Animated star field inside portal
    ctx.fillStyle = "#a070ff";
    for (let i = 0; i < 6; i++) {
      const angle = tick * 0.05 + i * Math.PI / 3;
      const r = 3 + (i % 3) * 3;
      const sx = px + CELL/2 + Math.cos(angle + i) * r;
      const sy = py + CELL/2 + Math.sin(angle * 1.3 + i) * r;
      ctx.fillRect(Math.floor(sx), Math.floor(sy), 2, 2);
    }
    // Bright center stars
    ctx.fillStyle = "#e0c0ff";
    const cx = px + CELL/2 + Math.sin(tick * 0.1) * 2;
    const cy = py + CELL/2 + Math.cos(tick * 0.13) * 2;
    ctx.fillRect(Math.floor(cx) - 1, Math.floor(cy), 2, 1);
    ctx.fillRect(Math.floor(cx), Math.floor(cy) - 1, 1, 2);
    // White twinkles
    ctx.fillStyle = "#ffffff";
    const t1x = px + 12 + (tick % 20) / 4;
    const t1y = py + 16;
    ctx.fillRect(Math.floor(t1x), t1y, 1, 1);
    const t2x = px + 26;
    const t2y = py + 28 - (tick % 15) / 4;
    ctx.fillRect(t2x, Math.floor(t2y), 1, 1);
  }

  // Minecraft-style slime block — translucent cube look with darker green core
  function drawSlime(ctx, px, py, monster, tick, colorOverride) {
    const color = colorOverride || getSlimeColor(monster);
    const isBoss = monster.isBoss;
    const phase = tick * 0.12 + monster.bouncePhase;
    const bounce = Math.sin(phase) * 1.5;

    const padding = isBoss ? 3 : 5;
    const x = px + padding;
    const y = py + padding + bounce;
    const size = CELL - padding * 2;

    // Shadow on floor
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(px + padding + 2, py + CELL - 4, size - 4, 2);

    // Boss aura
    if (isBoss) {
      const auraPulse = Math.sin(tick * 0.15) * 1 + 2;
      ctx.fillStyle = "rgba(163, 45, 45, 0.3)";
      ctx.fillRect(x - auraPulse, y - auraPulse, size + auraPulse*2, size + auraPulse*2);
    }

    // === Slime block cube ===
    // Outer translucent body
    ctx.fillStyle = color.body;
    ctx.fillRect(x, y, size, size);

    // Top edge highlight (lighter)
    ctx.fillStyle = color.light;
    ctx.fillRect(x, y, size, 3);
    ctx.fillRect(x, y, 3, size);

    // Bottom + right edges darker
    ctx.fillStyle = color.dark;
    ctx.fillRect(x, y + size - 3, size, 3);
    ctx.fillRect(x + size - 3, y, 3, size);

    // Inner core (darker green/blue blob inside, like a smaller slime in the block)
    const coreSize = Math.floor(size * 0.45);
    const coreX = x + Math.floor((size - coreSize) / 2);
    const coreY = y + Math.floor((size - coreSize) / 2);
    ctx.fillStyle = color.core;
    ctx.fillRect(coreX, coreY, coreSize, coreSize);

    // Core highlight
    ctx.fillStyle = color.dark;
    ctx.fillRect(coreX, coreY, coreSize, 2);
    ctx.fillRect(coreX, coreY, 2, coreSize);

    // === Slime face (on the core) ===
    // Eyes — Minecraft slimes have two black square eyes
    const eyeSize = isBoss ? 3 : 2;
    const eyeY = coreY + Math.floor(coreSize * 0.3);
    ctx.fillStyle = "#000000";
    ctx.fillRect(coreX + Math.floor(coreSize * 0.2), eyeY, eyeSize, eyeSize);
    ctx.fillRect(coreX + coreSize - Math.floor(coreSize * 0.2) - eyeSize, eyeY, eyeSize, eyeSize);

    // Mouth — small frown line
    const mouthY = coreY + Math.floor(coreSize * 0.7);
    if (isBoss) {
      // Boss has wider angry mouth
      ctx.fillStyle = "#000000";
      ctx.fillRect(coreX + Math.floor(coreSize * 0.25), mouthY, Math.floor(coreSize * 0.5), 1);
      ctx.fillRect(coreX + Math.floor(coreSize * 0.25), mouthY - 1, 1, 1);
      ctx.fillRect(coreX + Math.floor(coreSize * 0.75) - 1, mouthY - 1, 1, 1);
    } else {
      ctx.fillStyle = "#000000";
      ctx.fillRect(coreX + Math.floor(coreSize * 0.35), mouthY, Math.floor(coreSize * 0.3), 1);
    }

    // === Boss crown ===
    if (isBoss) {
      const crownY = y - 3;
      const crownX = x + Math.floor(size * 0.25);
      const crownW = Math.floor(size * 0.5);
      ctx.fillStyle = "#EF9F27";
      ctx.fillRect(crownX, crownY + 2, crownW, 2);
      ctx.fillRect(crownX, crownY, 2, 4);
      ctx.fillRect(crownX + Math.floor(crownW/2) - 1, crownY - 2, 2, 6);
      ctx.fillRect(crownX + crownW - 2, crownY, 2, 4);
      ctx.fillStyle = "#E24B4A";
      ctx.fillRect(crownX + Math.floor(crownW/2) - 1, crownY, 2, 2);
    }

    // Specular highlight on slime block face (top-left small bright square)
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fillRect(x + 4, y + 4, 3, 3);
  }

  // Steve from Minecraft — blocky pixelated figure
  function drawSteve(ctx, px, py, player, tick) {
    const cx = px + CELL/2;
    const cy = py + CELL/2;
    const facing = player.facing;
    const walkPhase = Math.sin(tick * 0.2) * 1.5;

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(cx - 8, py + CELL - 4, 16, 2);

    // === Body proportions (Steve is blocky) ===
    // Head: 10x10 px
    // Body: 8x12 px
    // Arms: 4x12 px each
    // Legs: 4x12 px each

    // === LEGS (denim pants) ===
    const legY = cy + 2;
    // Left leg
    ctx.fillStyle = "#3F5077"; // denim blue
    ctx.fillRect(cx - 4, legY, 4, 8 + walkPhase);
    ctx.fillStyle = "#2F3F60"; // darker denim
    ctx.fillRect(cx - 4, legY, 1, 8 + walkPhase);
    // Right leg
    ctx.fillStyle = "#3F5077";
    ctx.fillRect(cx, legY, 4, 8 - walkPhase);
    ctx.fillStyle = "#2F3F60";
    ctx.fillRect(cx + 3, legY, 1, 8 - walkPhase);

    // === BODY (cyan/teal shirt) ===
    ctx.fillStyle = "#00AFAF"; // Steve's classic teal shirt
    ctx.fillRect(cx - 4, cy - 5, 8, 8);
    // Shirt shading
    ctx.fillStyle = "#008888";
    ctx.fillRect(cx + 3, cy - 5, 1, 8);
    ctx.fillRect(cx - 4, cy + 2, 8, 1);
    // Shirt highlight
    ctx.fillStyle = "#33CCCC";
    ctx.fillRect(cx - 4, cy - 5, 1, 8);

    // === ARMS ===
    // Back arm (further from camera based on facing)
    ctx.fillStyle = "#008888"; // shaded arm
    if (facing === 1) {
      ctx.fillRect(cx + 4, cy - 5, 2, 8); // right side arm
    } else {
      ctx.fillRect(cx - 6, cy - 5, 2, 8); // left side arm
    }
    // Front arm
    ctx.fillStyle = "#00AFAF";
    if (facing === 1) {
      ctx.fillRect(cx - 6, cy - 5, 2, 8);
    } else {
      ctx.fillRect(cx + 4, cy - 5, 2, 8);
    }
    // Hands (skin tone)
    ctx.fillStyle = "#D9A37A";
    ctx.fillRect(cx + 4, cy + 3, 2, 2);
    ctx.fillRect(cx - 6, cy + 3, 2, 2);

    // === HEAD (skin tone with face) ===
    const headX = cx - 5;
    const headY = cy - 13;
    // Skin base
    ctx.fillStyle = "#D9A37A";
    ctx.fillRect(headX, headY, 10, 8);
    // Skin shading
    ctx.fillStyle = "#B58360";
    ctx.fillRect(headX + 9, headY, 1, 8);
    ctx.fillRect(headX, headY + 7, 10, 1);

    // === HAIR (brown, covers top and back) ===
    ctx.fillStyle = "#4A2A0A"; // dark brown hair
    ctx.fillRect(headX, headY, 10, 3); // top
    // Sideburns / hair sides
    ctx.fillRect(headX, headY + 3, 1, 2);
    ctx.fillRect(headX + 9, headY + 3, 1, 2);
    // Hair texture pixels
    ctx.fillStyle = "#5C3410";
    ctx.fillRect(headX + 2, headY + 1, 1, 1);
    ctx.fillRect(headX + 5, headY, 1, 1);
    ctx.fillRect(headX + 7, headY + 1, 1, 1);

    // === FACE ===
    // Eyes — white sclera with blue/purple pupils
    if (facing === 1) {
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(headX + 2, headY + 3, 2, 2);
      ctx.fillRect(headX + 6, headY + 3, 2, 2);
      // Pupils (Steve's iconic look)
      ctx.fillStyle = "#5C3410";
      ctx.fillRect(headX + 3, headY + 3, 1, 2);
      ctx.fillRect(headX + 7, headY + 3, 1, 2);
      // Blue iris (Steve's eye color)
      ctx.fillStyle = "#5070A0";
      ctx.fillRect(headX + 3, headY + 4, 1, 1);
      ctx.fillRect(headX + 7, headY + 4, 1, 1);
    } else {
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(headX + 2, headY + 3, 2, 2);
      ctx.fillRect(headX + 6, headY + 3, 2, 2);
      ctx.fillStyle = "#5C3410";
      ctx.fillRect(headX + 2, headY + 3, 1, 2);
      ctx.fillRect(headX + 6, headY + 3, 1, 2);
      ctx.fillStyle = "#5070A0";
      ctx.fillRect(headX + 2, headY + 4, 1, 1);
      ctx.fillRect(headX + 6, headY + 4, 1, 1);
    }

    // Mustache/mouth (Steve's signature)
    ctx.fillStyle = "#4A2A0A";
    ctx.fillRect(headX + 3, headY + 6, 4, 1);

    // Nose (subtle shadow)
    ctx.fillStyle = "#B58360";
    ctx.fillRect(headX + 4, headY + 5, 2, 1);
  }

  function drawMaze() {
    const canvas = document.getElementById("maze-canvas");
    if (!canvas || !state.maze) return;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#1a1428";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const px = x * CELL;
        const py = y * CELL;
        const cell = state.maze[y][x];
        if (cell === 1) drawWall(ctx, px, py);
        else if (cell === 2) drawPortal(ctx, px, py, state.tick);
        else drawFloor(ctx, px, py);
      }
    }
    state.monsters.filter(m => !m.isBoss).forEach(m => {
      drawSlime(ctx, m.x * CELL, m.y * CELL, m, state.tick);
    });
    state.monsters.filter(m => m.isBoss).forEach(m => {
      drawSlime(ctx, m.x * CELL, m.y * CELL, m, state.tick);
    });
    drawSteve(ctx, state.player.x * CELL, state.player.y * CELL, state.player, state.tick);
  }

      let resultMsg, resultBg, resultFg;
      if (correct && showBossTreatment) { resultMsg = '👑 BOSS DEFEATED! The portal is now yours.'; resultBg = "#2a4f1a"; resultFg = "#c8f0a0"; }
      else if (correct) { resultMsg = state.gameMode === "practice" ? '✨ Slime defeated! Streak grows.' : '✨ Slime defeated! It splits into bits.'; resultBg = "#2a4f1a"; resultFg = "#c8f0a0"; }
      else if (showBossTreatment) { resultMsg = `💔 The boss strikes hard — lost 2 lives. ${wouldDefeat ? 'No lives left!' : ''}`; resultBg = "#5a1818"; resultFg = "#f0c8c8"; }
      else if (state.gameMode === "practice") { resultMsg = '❌ Not quite — no penalty in practice mode. Streak reset.'; resultBg = "#5a1818"; resultFg = "#f0c8c8"; }
      else { resultMsg = `💔 Wrong answer — lost a life. ${wouldDefeat ? 'No lives left!' : ''}`; resultBg = "#5a1818"; resultFg = "#f0c8c8"; }

      fb.innerHTML = `
        <div style="background: ${resultBg}; color: ${resultFg}; padding: 12px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 10px;">${resultMsg}</div>
        <div class="panel">
          <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #a0a0c0; margin-bottom: 6px;">Correct answer: ${["A","B","C","D"][q.answer]}</div>
          <div style="font-size: 14px; line-height: 1.6;">${escapeHtml(q.exp)}</div>
        </div>
        <div style="display: flex; justify-content: flex-end;">
          <button id="resume-btn" style="font-weight: 500;">${wouldDefeat ? 'See results →' : (state.gameMode === "practice" ? 'Keep going →' : 'Back to the maze →')}</button>
        </div>
      `;
      document.getElementById("resume-btn").addEventListener("click", resumeGame);
    }
  }

  function renderChoice(text, i, q) {
    const letter = ["A","B","C","D"][i];
    let cls = "choice-btn";
    if (state.showFeedback) {
      if (i === q.answer) cls += " correct";
      else if (i === state.selectedChoice && i !== q.answer) cls += " wrong";
      else cls += " choice-btn-faded";
    }
    return `
      <button class="${cls}" data-idx="${i}" ${state.showFeedback ? "disabled" : ""} style="${state.showFeedback && i !== q.answer && i !== state.selectedChoice ? 'opacity: 0.5;' : ''}">
        <span style="font-weight: 500; min-width: 18px;">${letter}.</span>
        <span style="flex: 1;">${escapeHtml(text)}</span>
      </button>
    `;
  }

  function renderVictory() {
    const mins = Math.floor(state.elapsedTime / 60);
    const secs = state.elapsedTime % 60;
    const timeStr = mins + ":" + (secs < 10 ? "0" : "") + secs;
    const acc = state.questionsAnswered > 0 ? Math.round((state.correctAnswers / state.questionsAnswered) * 100) : 100;
    const bossSkipped = state.bossSkipped === true;
    const bossDefeated = !state.boss && !bossSkipped;
    let headline, subline;
    if (bossDefeated) { headline = 'You escaped!'; subline = 'The boss fell. The portal closes behind you.'; }
    else if (bossSkipped) { headline = 'You snuck past!'; subline = 'You slipped past the boss at the cost of 1 ❤️. Try facing it next time!'; }
    else { headline = 'You escaped!'; subline = 'The portal closes behind you.'; }
    root.innerHTML = `
      <div style="background: linear-gradient(180deg, #3C3489 0%, #7F77DD 100%); border-radius: 10px; padding: 32px 16px; margin-bottom: 20px; text-align: center;">
        <canvas id="victory-canvas" width="200" height="100" style="image-rendering: pixelated;"></canvas>
        <h1 style="font-size: 28px; margin: 12px 0 6px; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">${headline}</h1>
        <p style="font-size: 14px; color: #EEEDFE; margin: 0;">${subline}</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;">
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Time</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${timeStr}</div></div>
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Lives left</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${"❤️".repeat(state.lives)}</div></div>
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Slimes defeated</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${state.monstersDefeated}${bossDefeated ? ' + 👑' : ''}</div></div>
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Accuracy</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${state.correctAnswers}/${state.questionsAnswered} · ${acc}%</div></div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: center;">
        <button id="restart" style="font-weight: 500;">New dungeon →</button>
        <button id="to-menu">Main menu</button>
      </div>
    `;
    const vc = document.getElementById("victory-canvas");
    if (vc) {
      const ctx = vc.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      let vt = 0;
      const p = { x: 0, y: 0, facing: 1 };
      function vLoop() {
        ctx.clearRect(0, 0, 200, 100);
        drawPortal(ctx, 70, 30, vt);
        drawSteve(ctx, 110, 30, p, vt);
        vt++;
        if (state.mode === "victory") requestAnimationFrame(vLoop);
      }
      vLoop();
    }
    document.getElementById("restart").addEventListener("click", () => startGame("adventure"));
    document.getElementById("to-menu").addEventListener("click", () => { state.mode = "menu"; render(); });
  }

  function renderDefeat() {
    root.innerHTML = `
      <div style="background: linear-gradient(180deg, #501313 0%, #A32D2D 100%); border-radius: 10px; padding: 32px 16px; margin-bottom: 20px; text-align: center;">
        <div style="font-size: 60px; margin-bottom: 8px;">💀</div>
        <h1 style="font-size: 28px; margin: 0 0 6px; color: #FFFFFF;">Game over</h1>
        <p style="font-size: 14px; color: #F7C1C1; margin: 0;">The slime blocks overwhelmed you. A new dungeon awaits.</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;">
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Questions</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${state.questionsAnswered}</div></div>
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Correct</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${state.correctAnswers}</div></div>
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Slimes defeated</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${state.monstersDefeated}</div></div>
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Peak difficulty</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${TIER_LABELS[state.difficultyTier]}</div></div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: center;">
        <button id="restart" style="font-weight: 500;">Try again →</button>
        <button id="to-menu">Main menu</button>
      </div>
    `;
    document.getElementById("restart").addEventListener("click", () => startGame("adventure"));
    document.getElementById("to-menu").addEventListener("click", () => { state.mode = "menu"; render(); });
  }

  function renderPracticeSummary() {
    const mins = Math.floor(state.elapsedTime / 60);
    const secs = state.elapsedTime % 60;
    const timeStr = mins + ":" + (secs < 10 ? "0" : "") + secs;
    const acc = state.questionsAnswered > 0 ? Math.round((state.correctAnswers / state.questionsAnswered) * 100) : 0;
    const tierColor = TIER_COLORS[state.practiceTier];
    let feedback;
    if (state.questionsAnswered === 0) feedback = "No questions answered yet. Try again!";
    else if (acc >= 90) feedback = "Excellent. You're ready to move up a tier.";
    else if (acc >= 75) feedback = "Solid. A few more reps and you've got it.";
    else if (acc >= 60) feedback = "Getting there. Review the misses and try again.";
    else feedback = "Drop down a tier or review the explanations carefully.";

    root.innerHTML = `
      <div style="background: linear-gradient(180deg, ${tierColor.dark} 0%, ${tierColor.body} 100%); border-radius: 10px; padding: 32px 16px; margin-bottom: 20px; text-align: center;">
        <canvas id="summary-canvas" width="80" height="80" style="image-rendering: pixelated;"></canvas>
        <h1 style="font-size: 24px; margin: 12px 0 6px; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">Practice session ended</h1>
        <p style="font-size: 14px; color: rgba(255,255,255,0.85); margin: 0;">${TIER_LABELS[state.practiceTier]} tier · ${feedback}</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;">
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Questions</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${state.questionsAnswered}</div></div>
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Accuracy</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${state.correctAnswers}/${state.questionsAnswered} · ${acc}%</div></div>
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Best streak</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${state.bestStreak > 0 ? '🔥' : ''}${state.bestStreak}</div></div>
        <div class="panel" style="text-align: center; margin-bottom:0;"><div style="font-size: 11px; color: #a0a0c0; text-transform: uppercase;">Time</div><div style="font-size: 22px; font-weight: 500; margin-top: 4px;">${timeStr}</div></div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
        <button id="same-tier" style="font-weight: 500;">Same tier again</button>
        <button id="pick-tier">Pick a different tier</button>
        <button id="to-menu">Main menu</button>
      </div>
    `;
    const sc = document.getElementById("summary-canvas");
    if (sc) {
      const ctx = sc.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      let st = 0;
      const slimeM = { x: 0, y: 0, bouncePhase: 0, isBoss: state.practiceTier === 4 };
      function sLoop() {
        ctx.clearRect(0, 0, 80, 80);
        ctx.save();
        ctx.translate(80/2 - CELL/2, 80/2 - CELL/2);
        ctx.scale(1.3, 1.3);
        ctx.translate(-CELL/2 + CELL/4, -CELL/2 + CELL/4);
        drawSlime(ctx, 0, 0, slimeM, st, tierColor);
        ctx.restore();
        st++;
        if (state.mode === "practice_summary") requestAnimationFrame(sLoop);
      }
      sLoop();
    }
    document.getElementById("same-tier").addEventListener("click", () => startGame("practice", state.practiceTier));
    document.getElementById("pick-tier").addEventListener("click", () => { state.mode = "practice_menu"; render(); });
    document.getElementById("to-menu").addEventListener("click", () => { state.mode = "menu"; render(); });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
  }

  document.addEventListener("keydown", (e) => {
    if (state.mode !== "playing") return;
    const key = e.key.toLowerCase();
    if (key === "arrowup" || key === "w") { e.preventDefault(); movePlayer(0, -1); }
    else if (key === "arrowdown" || key === "s") { e.preventDefault(); movePlayer(0, 1); }
    else if (key === "arrowleft" || key === "a") { e.preventDefault(); movePlayer(-1, 0); }
    else if (key === "arrowright" || key === "d") { e.preventDefault(); movePlayer(1, 0); }
  });

  renderMenu();
})();
</script>
</body>
</html>
