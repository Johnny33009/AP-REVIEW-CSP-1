<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashPrep · AP CSP Flashcards</title>
<style>
  /* ---------- Design Tokens ---------- */
  :root {
    --bg: #f3f1ec;
    --bg-card: #ffffff;
    --bg-soft: #faf8f3;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-mute: #8a8a8a;
    --line: #e5e1d8;
    --line-strong: #cfc9bc;
    --accent: #b8862e;        /* amber/gold like ApexPrep */
    --accent-deep: #8b6320;
    --accent-soft: #f5ead0;
    --green: #4a7c3a;
    --green-soft: #dcebd2;
    --blue: #3a5a7c;
    --blue-soft: #d2dfeb;
    --red: #8b3a3a;
    --red-soft: #ebd2d2;
    --purple: #6a3a7c;
    --purple-soft: #e0d2eb;
    --orange: #b8602e;
    --orange-soft: #f5d9c4;
    --shadow-sm: 0 1px 2px rgba(20,15,5,.04), 0 0 0 1px rgba(20,15,5,.04);
    --shadow-md: 0 2px 8px rgba(20,15,5,.06), 0 0 0 1px rgba(20,15,5,.05);
    --shadow-lg: 0 12px 40px rgba(20,15,5,.10), 0 0 0 1px rgba(20,15,5,.05);
    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 20px;
    --font-display: 'Fraunces', 'Playfair Display', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  /* Subtle paper grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(184,134,46,.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(74,124,58,.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: #1a1612;
    color: #f5ead0;
    padding: 14px 28px;
    display: flex; align-items: center; gap: 28px;
    box-shadow: 0 1px 0 rgba(0,0,0,.2);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-display);
    font-weight: 600;
  }
  .brand-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f5d56e, var(--accent) 60%, var(--accent-deep));
    box-shadow: inset 0 -2px 4px rgba(0,0,0,.2);
  }
  .brand-name { font-size: 17px; letter-spacing: -.01em; }
  .brand-sub {
    font-size: 10px;
    color: var(--accent);
    letter-spacing: .15em;
    text-transform: uppercase;
    font-family: var(--font-body);
    font-weight: 500;
    margin-top: -2px;
  }
  .nav {
    display: flex; gap: 4px;
    font-size: 14px;
  }
  .nav button {
    background: transparent;
    border: none;
    color: #d5cdb8;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font: inherit;
    transition: all .15s;
  }
  .nav button:hover { color: #fff; background: rgba(255,255,255,.06); }
  .nav button.active { color: var(--accent); }
  .topbar-spacer { flex: 1; }
  .user-pill {
    font-size: 13px;
    color: #c8c0ad;
    display: flex; align-items: center; gap: 8px;
  }
  .user-pill::before {
    content: '';
    width: 18px; height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c8a05a, #8b6320);
  }

  /* ---------- Page ---------- */
  main {
    position: relative; z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 36px 28px 80px;
  }

  /* Page headers */
  .eyebrow {
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(28px, 4vw, 42px);
    letter-spacing: -.02em;
    line-height: 1.1;
    margin-bottom: 28px;
  }
  h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -.01em;
    margin-bottom: 14px;
  }
  h3 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.005em;
  }

  /* ---------- Home grid: mode cards ---------- */
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 36px;
  }
  @media (max-width: 720px) { .mode-grid { grid-template-columns: 1fr; } }

  .mode-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 22px 24px;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    gap: 18px;
    align-items: flex-start;
    text-align: left;
    width: 100%;
    font: inherit;
    color: inherit;
  }
  .mode-card:hover {
    border-color: var(--line-strong);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .mode-icon {
    flex-shrink: 0;
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #1a1612;
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .mode-body { flex: 1; }
  .mode-body h3 { margin-bottom: 4px; font-size: 16px; }
  .mode-body p {
    color: var(--ink-soft);
    font-size: 13.5px;
    margin-bottom: 10px;
  }
  .mode-cta {
    color: var(--accent-deep);
    font-size: 13px;
    font-weight: 600;
  }
  .mode-cta::after { content: ' →'; transition: transform .2s; display: inline-block; }
  .mode-card:hover .mode-cta::after { transform: translateX(3px); }

  /* ---------- Big Ideas section ---------- */
  .section-block {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 24px 26px;
  }
  .section-block h2 { margin-bottom: 4px; }
  .section-sub {
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 18px;
  }
  .bi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  @media (max-width: 900px) { .bi-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .bi-grid { grid-template-columns: 1fr; } }

  .bi-card {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: all .15s;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .bi-card:hover { background: #fff; border-color: var(--line-strong); }
  .bi-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .05em;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .bi-tag::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .bi-1 { background: var(--accent-soft); color: var(--accent-deep); }
  .bi-2 { background: #e3e3e3; color: #444; }
  .bi-3 { background: var(--green-soft); color: var(--green); }
  .bi-4 { background: var(--blue-soft); color: var(--blue); }
  .bi-5 { background: var(--red-soft); color: var(--red); }
  .bi-meta {
    color: var(--ink-mute);
    font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .bi-meta svg { width: 12px; height: 12px; }

  /* ---------- Setup screen ---------- */
  .back-link {
    background: none; border: none; cursor: pointer;
    color: var(--ink-soft);
    font: inherit; font-size: 14px;
    margin-bottom: 18px;
    padding: 4px 0;
  }
  .back-link:hover { color: var(--ink); }
  .back-link::before { content: '← '; }

  .setup-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 30px 32px;
    max-width: 600px;
    margin: 0 auto;
  }
  .setup-card h1 { margin-bottom: 6px; }
  .setup-card .lead {
    color: var(--ink-soft);
    margin-bottom: 24px;
  }
  .field {
    margin-bottom: 20px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--ink-soft);
  }
  .chip-row {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    cursor: pointer;
    transition: all .15s;
    font: inherit; color: inherit;
  }
  .chip:hover { border-color: var(--line-strong); }
  .chip.active {
    background: #1a1612;
    border-color: #1a1612;
    color: var(--accent);
  }
  .btn-primary {
    background: var(--accent);
    color: #1a1612;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
    box-shadow: 0 1px 0 rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn-primary:hover { background: var(--accent-deep); color: #f5ead0; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line-strong);
    padding: 10px 18px;
    border-radius: 10px;
    font: inherit;
    font-size: 13.5px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all .15s;
  }
  .btn-ghost:hover { background: var(--bg-soft); color: var(--ink); }

  /* ---------- Flashcard study screen ---------- */
  .study-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .study-meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    max-width: 200px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width .3s ease;
  }
  .progress-count { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }

  .stats-row {
    display: flex; gap: 14px;
    font-size: 12.5px;
    color: var(--ink-mute);
  }
  .stat-pill {
    background: var(--bg-card);
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .stat-pill strong { color: var(--ink); font-weight: 700; }
  .stat-pill.good strong { color: var(--green); }
  .stat-pill.bad strong { color: var(--red); }

  /* The flashcard itself */
  .card-stage {
    perspective: 2000px;
    max-width: 780px;
    margin: 0 auto 24px;
  }
  .flashcard {
    position: relative;
    min-height: 420px;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 36px 40px;
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
  }
  .card-back { transform: rotateY(180deg); }

  .card-tag-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .card-num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: .05em;
  }
  .card-question {
    font-family: var(--font-display);
    font-size: clamp(18px, 2.2vw, 22px);
    line-height: 1.4;
    letter-spacing: -.01em;
    margin-bottom: 18px;
    flex: 1;
  }
  .card-question code, .card-content code {
    font-family: var(--font-mono);
    font-size: .88em;
    background: var(--bg-soft);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--line);
  }
  .card-content {
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
  }
  .card-content pre {
    background: #1a1612;
    color: #f5ead0;
    padding: 14px 16px;
    border-radius: var(--r-sm);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.5;
    margin: 12px 0;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  .card-choices {
    display: grid;
    gap: 8px;
    margin-top: 6px;
  }
  .card-choice {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 10px 14px;
    border-radius: var(--r-sm);
    font-size: 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.45;
    transition: all .15s;
    position: relative;
  }
  .card-choice .letter {
    flex-shrink: 0;
    font-weight: 700;
    color: var(--ink-mute);
    font-family: var(--font-mono);
    font-size: 12px;
    margin-top: 1px;
    width: 18px;
  }
  .card-choice.clickable {
    cursor: pointer;
    user-select: none;
  }
  .card-choice.clickable:hover {
    background: #fff;
    border-color: var(--line-strong);
    transform: translateX(2px);
  }
  .card-choice.selected {
    background: #fff;
    border-color: var(--ink);
    border-width: 2px;
    padding: 9px 13px;        /* compensate for 2px border */
    box-shadow: 0 1px 3px rgba(20,15,5,.08);
  }
  .card-choice.selected .letter {
    color: var(--ink);
  }
  .card-choice.correct {
    background: var(--green-soft);
    border-color: var(--green);
  }
  .card-choice.correct .letter { color: var(--green); }
  .card-choice.wrong {
    background: var(--red-soft);
    border-color: var(--red);
  }
  .card-choice.wrong .letter { color: var(--red); }
  .card-choice .mark {
    margin-left: auto;
    font-weight: 700;
    color: var(--green);
    font-size: 16px;
    flex-shrink: 0;
  }
  .card-choice .mark.wrong { color: var(--red); }

  .flip-hint {
    text-align: center;
    color: var(--ink-mute);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-top: auto;
    padding-top: 18px;
  }
  .flip-hint kbd {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    margin: 0 2px;
  }

  .card-explanation {
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    font-size: 14px;
    line-height: 1.55;
    margin-top: 14px;
  }
  .card-explanation strong { color: var(--accent-deep); }

  /* Verdict banner shown after MCQ check */
  .verdict {
    max-width: 780px;
    margin: 0 auto 18px;
    padding: 16px 20px;
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    gap: 16px;
    border: 1px solid;
    animation: slideIn .25s ease-out;
  }
  .verdict.correct {
    background: var(--green-soft);
    border-color: var(--green);
    color: var(--green);
  }
  .verdict.incorrect {
    background: var(--red-soft);
    border-color: var(--red);
    color: var(--red);
  }
  .verdict-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: currentColor;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .verdict.correct .verdict-icon { color: var(--green-soft); }
  .verdict.incorrect .verdict-icon { color: var(--red-soft); }
  .verdict-text { color: var(--ink); }
  .verdict-title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 1px;
  }
  .verdict.correct .verdict-title { color: var(--green); }
  .verdict.incorrect .verdict-title { color: var(--red); }
  .verdict-sub { font-size: 13.5px; color: var(--ink-soft); }

  /* Action bar (Check / Reveal / Skip buttons) */
  .action-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .action-bar .btn-primary {
    padding: 14px 28px;
    font-size: 14.5px;
    min-width: 180px;
  }
  .action-bar .btn-primary:disabled {
    background: var(--line);
    color: var(--ink-mute);
    cursor: not-allowed;
    box-shadow: none;
  }
  .action-bar .btn-ghost {
    padding: 14px 20px;
  }

  /* Static (non-flipping) card face — used for MCQs in the new flow */
  .card-face.static {
    position: relative;
    min-height: 0;
    transform: none;
    backface-visibility: visible;
    -webkit-backface-visibility: visible;
    animation: slideIn .25s ease-out;
  }

  /* Card controls */
  .card-controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 8px;
    animation: slideIn .25s ease-out;
  }
  .control-btn {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 14px 20px;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 130px;
    justify-content: center;
  }
  .control-btn:hover { border-color: var(--line-strong); transform: translateY(-1px); }
  .control-btn .key {
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 1px 6px;
    border-radius: 3px;
    color: var(--ink-mute);
  }
  .control-btn.again { color: var(--red); }
  .control-btn.again:hover { background: var(--red-soft); border-color: var(--red); }
  .control-btn.hard { color: var(--orange); }
  .control-btn.hard:hover { background: var(--orange-soft); border-color: var(--orange); }
  .control-btn.good { color: var(--green); }
  .control-btn.good:hover { background: var(--green-soft); border-color: var(--green); }
  .control-btn.easy { color: var(--blue); }
  .control-btn.easy:hover { background: var(--blue-soft); border-color: var(--blue); }
  .control-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* Completion screen */
  .complete-card {
    max-width: 600px;
    margin: 40px auto 0;
    text-align: center;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 44px 32px;
  }
  .complete-card .emoji { font-size: 56px; margin-bottom: 12px; }
  .complete-card h1 { margin-bottom: 14px; }
  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 26px 0;
  }
  .result-stat {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 16px 12px;
  }
  .result-stat .num {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-stat .lbl {
    font-size: 11px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: .08em;
    font-weight: 600;
  }
  .result-stat.again .num { color: var(--red); }
  .result-stat.good .num { color: var(--green); }
  .result-stat.easy .num { color: var(--blue); }

  /* Footer */
  footer {
    text-align: center;
    padding: 40px 20px 20px;
    color: var(--ink-mute);
    font-size: 12px;
    position: relative;
    z-index: 1;
  }
  footer .heart { color: var(--accent); }

  /* Hidden helper */
  .hidden { display: none !important; }

  /* Animation: card slide in */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .slide-in { animation: slideIn .25s ease-out; }

  /* Keyboard hints bottom strip */
  .keyhints {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: var(--ink-mute);

/* ===================== APP STATE ===================== */
const state = {
  route: 'home',
  mode: null,           // 'fullexam' | 'adaptive' | 'bigidea'
  selectedBI: null,
  deckSize: 10,
  flipped: false,
  selected: [],         // student's chosen answer indices (MCQ only)
  checked: false,       // whether student has hit "Check answer" (MCQ only)
  cardIndex: 0,
  cards: [],
  results: { again: 0, hard: 0, good: 0, easy: 0 },
  history: (() => {
    try { return JSON.parse(localStorage.getItem('apcsp-flashprep-history') || '{}'); }
    catch(e) { return {}; }
  })(),
};

function saveHistory() {
  try { localStorage.setItem('apcsp-flashprep-history', JSON.stringify(state.history)); } catch(e) {}
}

function logRating(cardId, rating) {
  if (!state.history[cardId]) state.history[cardId] = { again:0, hard:0, good:0, easy:0, last: null };
  state.history[cardId][rating]++;
  state.history[cardId].last = rating;
  saveHistory();
}

/* ===================== ROUTING ===================== */
const app = document.getElementById('app');

function go(route, opts={}) {
  state.route = route;
  Object.assign(state, opts);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  document.querySelectorAll('.nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.route === state.route || (state.route !== 'stats' && b.dataset.route === 'home'));
  });
  if (state.route === 'home') return renderHome();
  if (state.route === 'setup') return renderSetup();
  if (state.route === 'study') return renderStudy();
  if (state.route === 'complete') return renderComplete();
  if (state.route === 'stats') return renderStats();
}

/* ===================== STUDY ===================== */
function startDeck(cards, title) {
  if (cards.length === 0) {
    alert('No cards available.');
    return;
  }
  state.cards = cards;
  state.cardIndex = 0;
  state.flipped = false;
  state.selected = [];     // student's chosen answer indices
  state.checked = false;   // whether they've hit "Check"
  state.results = { again: 0, hard: 0, good: 0, easy: 0 };
  state.deckTitle = title;
  go('study');
}

function renderStudy() {
  const card = state.cards[state.cardIndex];
  const total = state.cards.length;
  const pct = ((state.cardIndex) / total) * 100;
  const bi = bigIdeas.find(b => b.id === card.bi);
  const isMCQ = card.type === 'mcq';
  const isMulti = isMCQ && !!card.answers;
  const needToPick = isMulti ? 2 : 1;
  const revealed = isMCQ ? state.checked : state.flipped;

  // Build correct-answer set
  const correctSet = isMCQ ? (card.answers || [card.answer]) : [];
  const correctSetKey = correctSet.slice().sort().join(',');
  const selectedKey = state.selected.slice().sort().join(',');
  const isCorrect = isMCQ && state.checked && selectedKey === correctSetKey;

  app.innerHTML = `
    <div class="slide-in">
      <div class="study-header">
        <button class="back-link" id="back">Exit deck</button>
        <div class="study-meta">
          <span class="progress-count">${state.cardIndex + 1} / ${total}</span>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="stats-row">
          <span class="stat-pill bad"><strong>${state.results.again}</strong> again</span>
          <span class="stat-pill good"><strong>${state.results.good + state.results.easy}</strong> got</span>
        </div>
      </div>

      <div style="text-align:center; margin-bottom:14px;">
        <span class="bi-tag bi-${card.bi}" style="display:inline-flex;">BI ${card.bi} · ${bi.name}</span>
      </div>

      <div class="card-stage">
        ${isMCQ
          ? renderMCQCard(card, state.selected, state.checked, correctSet, isMulti)
          : renderFlashCard(card, state.flipped)
        }
      </div>

      ${isMCQ && state.checked ? `
        <div class="verdict ${isCorrect ? 'correct' : 'incorrect'}">
          <div class="verdict-icon">${isCorrect ? '✓' : '✕'}</div>
          <div class="verdict-text">
            <div class="verdict-title">${isCorrect ? 'Correct!' : 'Not quite'}</div>
            <div class="verdict-sub">${isCorrect
              ? 'Nice work. Rate how well you knew it.'
              : `The correct answer ${isMulti ? 'is' : 'was'} <strong>${correctSet.map(i=>'ABCD'[i]).join(' and ')}</strong>.`
            }</div>
          </div>
        </div>
      ` : ''}

      ${renderActionBar(card, isMCQ, isMulti, needToPick, revealed)}

      <div class="keyhints">
        ${isMCQ && !state.checked
          ? `<kbd>A</kbd>–<kbd>D</kbd> pick · <kbd>Enter</kbd> check · <kbd>Esc</kbd> exit`
          : (!revealed
              ? `<kbd>Space</kbd> reveal · <kbd>Esc</kbd> exit`
              : `<kbd>1</kbd>–<kbd>4</kbd> rate · <kbd>Esc</kbd> exit`)
        }
      </div>
    </div>
  `;

  document.getElementById('back').onclick = () => {
    if (confirm('Exit this deck? Your ratings so far will still be saved.')) go('home');
  };

  // MCQ: clicking a choice toggles selection (before check)
  if (isMCQ && !state.checked) {
    app.querySelectorAll('.card-choice[data-idx]').forEach(el => {
      el.onclick = () => toggleChoice(parseInt(el.dataset.idx), isMulti);
    });
    const checkBtn = document.getElementById('checkBtn');
    if (checkBtn) checkBtn.onclick = checkAnswer;
    const skipBtn = document.getElementById('skipBtn');
    if (skipBtn) skipBtn.onclick = () => { state.checked = true; render(); };
  }

  // Flashcard: clicking the card flips it, "Reveal" button does the same
  if (!isMCQ) {
    const fc = document.getElementById('flashcard');
    if (fc) fc.onclick = flipCard;
    const revealBtn = document.getElementById('revealBtn');
    if (revealBtn) revealBtn.onclick = flipCard;
  }

  // Rating buttons (after reveal/check)
  app.querySelectorAll('.control-btn[data-rate]').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); rateCard(b.dataset.rate); };
  });
}

function renderMCQCard(card, selected, checked, correctSet, isMulti) {
  return `
    <div class="card-face card-front static">
      <div class="card-tag-row">
        <span class="card-num">CARD ${card.id.toUpperCase()}</span>
        <span class="card-num">${isMulti ? 'SELECT TWO' : 'MULTIPLE CHOICE'}</span>
      </div>
      <div class="card-question">${renderText(card.q)}</div>
      <div class="card-choices">
        ${card.choices.map((c, i) => {
          const isSelected = selected.includes(i);
          const isCorrect = correctSet.includes(i);
          let cls = 'card-choice';
          if (!checked && isSelected) cls += ' selected';
          if (checked && isCorrect) cls += ' correct';
          if (checked && isSelected && !isCorrect) cls += ' wrong';
          if (!checked) cls += ' clickable';
          return `
            <div class="${cls}" ${!checked ? `data-idx="${i}"` : ''}>
              <span class="letter">${'ABCD'[i]}</span>
              <span>${renderText(c)}</span>
              ${checked && isCorrect ? '<span class="mark">✓</span>' : ''}
              ${checked && isSelected && !isCorrect ? '<span class="mark wrong">✕</span>' : ''}
            </div>
          `;
        }).join('')}
      </div>
      ${checked ? `
        <div class="card-explanation"><strong>Why:</strong> ${renderText(card.explain)}</div>
      ` : `
        <div class="flip-hint">
          ${isMulti
            ? `Tap the two best choices, then check your answer`
            : `Tap a choice, then check your answer`}
        </div>
      `}
    </div>
  `;
}

function renderFlashCard(card, flipped) {
  return `
    <div class="flashcard ${flipped ? 'flipped' : ''}" id="flashcard">
      <div class="card-face card-front">
        <div class="card-tag-row">
          <span class="card-num">CARD ${card.id.toUpperCase()}</span>
          <span class="card-num">CONCEPT</span>
        </div>
        <div class="card-question">${renderText(card.q)}</div>
        <div class="flip-hint">Click card or press <kbd>Space</kbd> to reveal answer</div>
      </div>
      <div class="card-face card-back">
        <div class="card-tag-row">
          <span class="card-num">ANSWER</span>
          <span class="card-num">CARD ${card.id.toUpperCase()}</span>
        </div>
        <div class="card-content">${renderText(card.a)}</div>
        <div class="flip-hint">Rate how well you knew it</div>
      </div>
    </div>
  `;
}

function renderActionBar(card, isMCQ, isMulti, needToPick, revealed) {
  // MCQ + not checked yet: show "Check answer" button (enabled when right count selected)
  if (isMCQ && !state.checked) {
    const canCheck = state.selected.length === needToPick;
    return `
      <div class="action-bar">
        <button class="btn-primary" id="checkBtn" ${canCheck ? '' : 'disabled'}>
          ${canCheck
            ? 'Check answer'
            : (state.selected.length === 0
                ? `Pick ${isMulti ? 'two answers' : 'an answer'}`
                : `Pick ${needToPick - state.selected.length} more`)
          }
        </button>
        <button class="btn-ghost" id="skipBtn">Skip / I don't know</button>
      </div>
    `;
  }
  // Otherwise (revealed): show rating controls
  if (revealed) {
    return `
      <div class="card-controls">
        <button class="control-btn again" data-rate="again">
          <span class="key">1</span> Again
        </button>
        <button class="control-btn hard" data-rate="hard">
          <span class="key">2</span> Hard
        </button>
        <button class="control-btn good" data-rate="good">
          <span class="key">3</span> Good
        </button>
        <button class="control-btn easy" data-rate="easy">
          <span class="key">4</span> Easy
        </button>
      </div>
    `;
  }
  // Flashcard, not yet flipped: show "Reveal" button
  return `
    <div class="action-bar">
      <button class="btn-primary" id="revealBtn">Reveal answer</button>
    </div>
  `;
}

function toggleChoice(idx, isMulti) {
  if (state.checked) return;
  const i = state.selected.indexOf(idx);
  if (i >= 0) {
    state.selected.splice(i, 1);
  } else {
    if (isMulti) {
      if (state.selected.length >= 2) state.selected.shift(); // drop oldest
      state.selected.push(idx);
    } else {
      state.selected = [idx];
    }
  }
  render();
}

function checkAnswer() {
  state.checked = true;
  render();
}

function flipCard() {
  if (state.route !== 'study') return;
  const card = state.cards[state.cardIndex];
  if (card.type === 'mcq') return; // MCQ uses check flow, not flip
  state.flipped = !state.flipped;
  render();
}

function rateCard(rating) {
  const card = state.cards[state.cardIndex];
  const revealed = card.type === 'mcq' ? state.checked : state.flipped;
  if (!revealed) return;
  state.results[rating]++;
  logRating(card.id, rating);

  // "Again" cards get re-inserted later in the deck
  if (rating === 'again') {
    const insertAt = Math.min(state.cards.length, state.cardIndex + 4);
    state.cards.splice(insertAt, 0, card);
  }

  state.cardIndex++;
  // Reset per-card state
  state.flipped = false;
  state.selected = [];
  state.checked = false;

  if (state.cardIndex >= state.cards.length) {
    go('complete');
  } else {
    render();
  }
}

/* ===================== COMPLETE ===================== */
function renderComplete() {
  const total = state.results.again + state.results.hard + state.results.good + state.results.easy;
  const known = state.results.good + state.results.easy;
  const pct = total > 0 ? Math.round((known / total) * 100) : 0;
  const msg =
    pct >= 90 ? { e:'🎯', t:'You crushed it' } :
    pct >= 70 ? { e:'✨', t:'Solid run' } :
    pct >= 50 ? { e:'📚', t:'Good progress' } :
                { e:'💪', t:'Keep at it' };

  app.innerHTML = `
    <div class="slide-in">
      <div class="complete-card">
        <div class="emoji">${msg.e}</div>
        <div class="eyebrow">DECK COMPLETE</div>
        <h1>${msg.t}</h1>
        <p style="color:var(--ink-soft); font-size:15px;">
          You finished <strong>${state.deckTitle}</strong> with <strong>${pct}%</strong> known.
        </p>
        <div class="results-grid">
          <div class="result-stat again"><div class="num">${state.results.again}</div><div class="lbl">Again</div></div>
          <div class="result-stat"><div class="num">${state.results.hard}</div><div class="lbl">Hard</div></div>
          <div class="result-stat good"><div class="num">${state.results.good}</div><div class="lbl">Good</div></div>
        </div>
        <div style="display:flex; gap:10px; justify-content:center;">
          <button class="btn-primary" id="again">Study another deck</button>
          <button class="btn-ghost" id="stats">View progress</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('again').onclick = () => go('home');
  document.getElementById('stats').onclick = () => go('stats');
}

/* ===================== STATS ===================== */
function renderStats() {
  const hist = state.history;
  const seen = Object.keys(hist).length;
  const totalCards = DECK.length;
  let totalRatings = 0, mastered = 0, struggling = 0;
  Object.values(hist).forEach(h => {
    const sum = h.again + h.hard + h.good + h.easy;
    totalRatings += sum;
    if (h.last === 'good' || h.last === 'easy') mastered++;
    if (h.again > h.good + h.easy) struggling++;
  });
  const biStats = bigIdeas.map(bi => {
    const cards = DECK.filter(c => c.bi === bi.id);
    let count = 0;
    cards.forEach(c => { if (hist[c.id]) count++; });
    return { ...bi, count, total: cards.length };
  });

  app.innerHTML = `
    <div class="slide-in">
      <div class="eyebrow">PROGRESS</div>
      <h1>How you're tracking</h1>

      <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:28px;">
        <div class="result-stat"><div class="num">${seen}/${totalCards}</div><div class="lbl">Cards seen</div></div>
        <div class="result-stat good"><div class="num">${mastered}</div><div class="lbl">Currently known</div></div>
        <div class="result-stat again"><div class="num">${struggling}</div><div class="lbl">Need review</div></div>
        <div class="result-stat"><div class="num">${totalRatings}</div><div class="lbl">Total ratings</div></div>
      </div>

      <section class="section-block" style="margin-bottom:20px;">
        <h2>Coverage by Big Idea</h2>
        <div class="section-sub">How many cards from each unit you've reviewed at least once.</div>
        <div style="display:grid; gap:14px;">
          ${biStats.map(bi => {
            const pct = bi.total > 0 ? Math.round((bi.count / bi.total) * 100) : 0;
            return `
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:13.5px;">
                  <span class="bi-tag bi-${bi.id}">BI ${bi.id} · ${bi.name}</span>
                  <span style="color:var(--ink-mute); font-variant-numeric:tabular-nums;"><strong style="color:var(--ink)">${bi.count}</strong> / ${bi.total} (${pct}%)</span>
                </div>
                <div class="progress-track" style="max-width:none; height:8px;">
                  <div class="progress-fill" style="width:${pct}%"></div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </section>

      <div style="display:flex; gap:10px;">
        <button class="btn-primary" id="study">Start studying</button>
        <button class="btn-ghost" id="reset">Reset progress</button>
      </div>
    </div>
  `;
  document.getElementById('study').onclick = () => go('home');
  document.getElementById('reset').onclick = () => {
    if (confirm('Clear all your progress data? This cannot be undone.')) {
      state.history = {};
      saveHistory();
      render();
    }
  };
}

/* ===================== HELPERS ===================== */
const bigIdeas = [

];

function countByBI(id) { return DECK.filter(c => c.bi === id).length; }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildAdaptive() {
  // Weight cards by how often "again" was selected; unseen cards get medium weight.
  const weighted = DECK.map(c => {
    const h = state.history[c.id] || { again:0, hard:0, good:0, easy:0 };
    const seen = h.again + h.hard + h.good + h.easy;
    let weight;
    if (seen === 0) weight = 2;
    else weight = 1 + (h.again * 3) + (h.hard * 1.5) - (h.easy * 0.5);
    return { card: c, weight: Math.max(0.5, weight) };
  });
  // Sort by weight desc; take top 20; light shuffle inside that
  weighted.sort((a, b) => b.weight - a.weight);
  return shuffle(weighted.slice(0, 20).map(w => w.card));
}

function renderText(s) {
  // Escape HTML except keep simple **bold**, *italics*, and preserve <br>
  if (!s) return '';
  let out = s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Code spans `code`
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Multi-line code blocks: lines starting with "    " or that contain pseudocode → wrap
  if (out.includes('\n') && (out.includes('←') || out.includes('REPEAT') || out.includes('PROCEDURE') || out.includes('IF') || out.includes('FOR EACH'))) {
    const parts = out.split('\n\n');
    out = parts.map(p => {
      if (p.includes('←') || /^(REPEAT|PROCEDURE|IF|FOR EACH|DISPLAY|RETURN|Line\s)/m.test(p)) {
        return `<pre>${p}</pre>`;
      }
      return p.replace(/\n/g, '<br>');
    }).join('');
  } else {
    out = out.replace(/\n/g, '<br>');
  }
  return out;
}

/* ===================== KEYBOARD ===================== */
document.addEventListener('keydown', (e) => {
  if (state.route !== 'study') return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'Escape') {
    if (confirm('Exit this deck?')) go('home');
    return;
  }

  const card = state.cards[state.cardIndex];
  if (!card) return;
  const isMCQ = card.type === 'mcq';
  const isMulti = isMCQ && !!card.answers;
  const needToPick = isMulti ? 2 : 1;
  const revealed = isMCQ ? state.checked : state.flipped;

  if (isMCQ && !state.checked) {
    // Stage A: picking answers
    const k = e.key.toLowerCase();
    const letterMap = { a:0, b:1, c:2, d:3 };
    if (letterMap[k] !== undefined && letterMap[k] < card.choices.length) {
      e.preventDefault();
      toggleChoice(letterMap[k], isMulti);
      return;
    }
    if (e.key === 'Enter' && state.selected.length === needToPick) {
      e.preventDefault();
      checkAnswer();
      return;
    }
  } else if (!isMCQ && !state.flipped) {
    // Flashcard: space to reveal
    if (e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      flipCard();
      return;
    }
  } else if (revealed) {
    // Stage C: rating
    const map = { '1':'again', '2':'hard', '3':'good', '4':'easy' };
    if (map[e.key]) {
      e.preventDefault();
      rateCard(map[e.key]);
    }
  }
});

render();
